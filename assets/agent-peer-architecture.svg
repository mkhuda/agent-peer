<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">agent-peer architecture</title>
  <desc id="desc">agent-peer is a local IPC mesh connecting Claude Code, Antigravity, pi, opencode, and other agent harnesses on the same machine over Unix Domain Sockets, backed by a shared registry and per-session inbox, cursor, and lock files, with a reactive wait-to-wakeup loop.</desc>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="accent-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
    <style>
      .title { fill: #ffffff; font: 700 26px JetBrains Mono, IBM Plex Mono, monospace; }
      .subtitle { fill: #94a3b8; font: 500 13px JetBrains Mono, IBM Plex Mono, monospace; }
      .box-title { fill: #ffffff; font: 700 14px JetBrains Mono, IBM Plex Mono, monospace; }
      .box-sub { fill: #cbd5e1; font: 500 10.5px JetBrains Mono, IBM Plex Mono, monospace; }
      .tiny { fill: #94a3b8; font: 500 10px JetBrains Mono, IBM Plex Mono, monospace; }
      .arrow-label { fill: #94a3b8; font: 600 10.5px JetBrains Mono, IBM Plex Mono, monospace; }
      .accent-label { fill: #fbbf24; font: 700 11px JetBrains Mono, IBM Plex Mono, monospace; }
    </style>
  </defs>

  <rect width="1100" height="620" fill="#020617"/>
  <rect width="1100" height="620" fill="url(#grid)" opacity="0.9"/>
  <rect x="24" y="24" width="1052" height="572" rx="18" fill="#0f172a" opacity="0.58" stroke="#1e293b" stroke-width="1.5"/>

  <circle cx="54" cy="58" r="6" fill="#34d399"/>
  <text x="74" y="66" class="title">agent-peer</text>
  <text x="74" y="90" class="subtitle">A local IPC mesh: any agent harness on this machine can find, message, and reactively wake up any other.</text>

  <!-- Harness session boxes -->
  <rect x="80" y="140" width="220" height="72" rx="8" fill="#0f172a"/>
  <rect x="80" y="140" width="220" height="72" rx="8" fill="#083344" fill-opacity="0.5" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="190" y="170" class="box-title" text-anchor="middle">Claude Code</text>
  <text x="190" y="190" class="box-sub" text-anchor="middle">listen · send · wait</text>

  <rect x="320" y="140" width="220" height="72" rx="8" fill="#0f172a"/>
  <rect x="320" y="140" width="220" height="72" rx="8" fill="#064e3b" fill-opacity="0.5" stroke="#34d399" stroke-width="1.5"/>
  <text x="430" y="170" class="box-title" text-anchor="middle">Antigravity (agy)</text>
  <text x="430" y="190" class="box-sub" text-anchor="middle">listen · send · wait</text>

  <rect x="560" y="140" width="220" height="72" rx="8" fill="#0f172a"/>
  <rect x="560" y="140" width="220" height="72" rx="8" fill="#3b0764" fill-opacity="0.42" stroke="#c084fc" stroke-width="1.5"/>
  <text x="670" y="170" class="box-title" text-anchor="middle">pi</text>
  <text x="670" y="190" class="box-sub" text-anchor="middle">listen · send · wait</text>

  <rect x="800" y="140" width="220" height="72" rx="8" fill="#0f172a"/>
  <rect x="800" y="140" width="220" height="72" rx="8" fill="#881337" fill-opacity="0.42" stroke="#fb7185" stroke-width="1.5"/>
  <text x="910" y="170" class="box-title" text-anchor="middle">opencode</text>
  <text x="910" y="190" class="box-sub" text-anchor="middle">listen · send · wait</text>

  <!-- Down arrows into the socket layer -->
  <path d="M 190 212 L 190 288" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 430 212 L 430 288" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 670 212 L 670 288" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 910 212 L 910 288" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="205" y="255" class="arrow-label">send</text>

  <!-- Socket / transport layer -->
  <rect x="80" y="292" width="940" height="66" rx="8" fill="#0f172a"/>
  <rect x="80" y="292" width="940" height="66" rx="8" fill="#1e293b" opacity="0.66" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="550" y="320" class="box-title" text-anchor="middle">Unix Domain Socket — /tmp/cc-socks/&lt;pid&gt;.sock</text>
  <text x="550" y="340" class="box-sub" text-anchor="middle">auth token handshake + JSON message frame · delivered in under 200ms</text>

  <!-- Down arrows into persistent state -->
  <path d="M 400 358 C 380 380, 350 400, 330 418" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 700 358 C 720 380, 750 400, 770 418" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Registry box -->
  <rect x="140" y="422" width="380" height="80" rx="8" fill="#0f172a"/>
  <rect x="140" y="422" width="380" height="80" rx="8" fill="#083344" fill-opacity="0.5" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="330" y="452" class="box-title" text-anchor="middle">~/.claude/sessions/*.json</text>
  <text x="330" y="472" class="box-sub" text-anchor="middle">registry: name · pid · peerToken</text>
  <text x="330" y="488" class="box-sub" text-anchor="middle">cwd · engine (auto-detected)</text>

  <!-- agent-peer state box -->
  <rect x="580" y="422" width="380" height="80" rx="8" fill="#0f172a"/>
  <rect x="580" y="422" width="380" height="80" rx="8" fill="#064e3b" fill-opacity="0.5" stroke="#34d399" stroke-width="1.5"/>
  <text x="770" y="452" class="box-title" text-anchor="middle">~/.agent-peer/</text>
  <text x="770" y="472" class="box-sub" text-anchor="middle">inbox.jsonl · cursors/*.json</text>
  <text x="770" y="488" class="box-sub" text-anchor="middle">locks/*.lock (one wait per session)</text>

  <!-- Reactive wakeup loop (the standout mechanic) -->
  <path d="M 960 460 C 1050 460, 1050 190, 1020 190" fill="none" stroke="#fbbf24" stroke-width="2.2" stroke-dasharray="7 7" marker-end="url(#accent-arrow)"/>

  <!-- Solid label block so the dashed line never crosses through the text -->
  <rect x="988" y="298" width="88" height="46" rx="7" fill="#1c1305" stroke="#fbbf24" stroke-width="1.3"/>
  <text x="1032" y="317" class="accent-label" text-anchor="middle">wait</text>
  <text x="1032" y="333" class="accent-label" text-anchor="middle">-&gt; wakeup</text>

  <!-- Flow caption -->
  <text x="74" y="548" class="tiny">flow:  harness A "send" -&gt; socket -&gt; harness B's inbox  |  harness B "wait" blocks, merges any backlog, returns the instant a message lands</text>
  <text x="74" y="568" class="tiny">no polling anywhere in the loop - each session's own process exit is what wakes its agent loop back up.</text>
</svg>
